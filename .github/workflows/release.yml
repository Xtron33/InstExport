name: Release candidate

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Check and package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Check tag and manifest versions
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          manifest_version=$(node -p "require('./manifest.json').version")
          test "$version" = "$manifest_version"
          test "$GITHUB_REF_NAME" = "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Yarn Classic
        run: npm install --global yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Check formatting, types, lint, and tests
        run: |
          yarn format:check
          yarn typecheck
          yarn lint
          yarn test

      - name: Build CCX package
        run: yarn package

      - name: Verify package and create checksum
        shell: bash
        run: |
          asset="release/InstExport-${{ steps.version.outputs.version }}.ccx"
          unzip -t "$asset"
          unzip -Z1 "$asset" > "$RUNNER_TEMP/package-files.txt"
          for file in manifest.json index.html index.js styles.css; do
            grep -Fxq "$file" "$RUNNER_TEMP/package-files.txt"
          done
          sha256sum "$asset" > "$asset.sha256"

      - name: Upload release files for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: InstExport-${{ steps.version.outputs.version }}
          path: |
            release/InstExport-${{ steps.version.outputs.version }}.ccx
            release/InstExport-${{ steps.version.outputs.version }}.ccx.sha256
          if-no-files-found: error
          retention-days: 30

  draft:
    name: Create draft GitHub release
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download checked package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: InstExport-${{ needs.package.outputs.version }}
          path: release

      - name: Create or refresh draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          asset="release/InstExport-$VERSION.ccx"
          checksum="$asset.sha256"
          sha256sum --check "$checksum"

          if gh release view "$tag" >/dev/null 2>&1; then
            is_draft=$(gh release view "$tag" --json isDraft --jq '.isDraft')
            if [ "$is_draft" != true ]; then
              echo "Release $tag is already published; refusing to replace its assets." >&2
              exit 1
            fi
            gh release upload "$tag" "$asset" "$checksum" --clobber
          else
            gh release create "$tag" "$asset" "$checksum" \
              --draft --verify-tag --generate-notes --title "InstExport $VERSION"
          fi
